services:
  workstation-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workstation-manager
    restart: unless-stopped
    ports:
      - "${PORT:-2301}:${PORT:-2301}"
    environment:
      - HOST=0.0.0.0
      - PORT=${PORT:-2301}
      - SERVER_URL=${SERVER_URL:-}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:postgres_pass@postgres:5432/workstation_manager}
      - WOL_BROADCAST_IP=${WOL_BROADCAST_IP:-255.255.255.255}
      - WOL_PORT=${WOL_PORT:-9}
    volumes:
      # Persistent storage for fallback SQLite, tokens, and data
      - ./data:/app/data
      - ./scripts:/app/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Production PostgreSQL database service
  postgres:
    image: postgres:16-alpine
    container_name: workstation-manager-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-workstation_manager}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-workstation_manager}"]
      interval: 3s
      timeout: 3s
      retries: 5


volumes:
  postgres_data:

